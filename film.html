<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090d16">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/film-180.png">
<link rel="icon" href="icons/film-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الأفلام">
<title>استوديو الأفلام والمسلسلات</title>
<style>
@font-face{font-family:Cairo;src:url(fonts/cairo-arabic.woff2) format("woff2");font-display:swap}
:root{--bg:#090d16;--card:#131c2e;--panel:#1e293b;--accent:#10b981;--blue:#3b82f6;--warn:#f59e0b;--text:#f8fafc;--muted:#94a3b8;--border:#334155}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Cairo,system-ui,sans-serif;padding-bottom:90px}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;position:sticky;top:0;background:#090d16ee;z-index:5;border-bottom:1px solid var(--border)}
header h1{font-size:17px;margin:0;flex:1}
nav{display:flex;gap:6px;padding:8px 12px;overflow-x:auto}
nav button{flex:1;white-space:nowrap}
main{padding:0 12px}
.c{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;margin:10px 0}
.c h3{margin:0 0 6px;font-size:16px}
.m{color:var(--muted);font-size:13px;line-height:1.7}
label.l{display:block;font-size:13px;color:#cbd5e1;margin:10px 0 4px}
input,textarea,select{width:100%;background:#0b1220;color:var(--text);border:1px solid var(--border);border-radius:10px;padding:9px;font-family:inherit;font-size:15px}
textarea{resize:vertical}
.row{display:flex;gap:8px}.row>div{flex:1;min-width:0}
.b{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-family:inherit;font-size:14px;cursor:pointer;margin:6px 4px 0 0}
.b.g{background:var(--accent);border-color:var(--accent);color:#04130d;font-weight:700}
.b.bl{background:#1d4ed8;border-color:#1d4ed8}
.b.on{outline:2px solid #38bdf8}
.b.r{color:#fca5a5}
.pair{display:flex;gap:6px;margin-top:6px}.pair .b{margin:0}.pair .b:first-child{flex:1}
.shot{border:1px solid var(--border);border-radius:12px;padding:10px;margin:10px 0;background:#0f172a}
.shot.done{opacity:.6;border-color:#166534}
.shot img{max-width:100%;border-radius:10px;margin-top:6px}
.hd{display:flex;align-items:center;gap:8px}.hd b{flex:1}
.tag{font-size:11px;background:#1e293b;border-radius:99px;padding:1px 8px;color:#cbd5e1}
</style>
</head>
<body>
<header><button class="b" data-a="home" style="margin:0">🏠</button><h1>🎬 استوديو الأفلام والمسلسلات</h1><button class="b" id="instBtn" style="margin:0;display:none">📲</button><button class="b" data-a="hist" style="margin:0">🕘</button></header>
<nav id="nav"></nav>
<main id="app"></main>
<script src="core.js"></script>
<script>
const {esc,toast}=CORE;
const DEF={step:0,form:'short',series:'',bible:'',eps:[],epSum:'',idea:'',genre:'comedy',lang:'eg',satire:'light',voice:'thriller',customVoice:'',
 visual:'3d',customVisual:'',aspect:'9:16',sec:60,parts:'auto',charIds:[],singer:'',place:'',script:'',paste:'',shots:[],sendIdx:0};
const st=CORE.store('film',DEF);const p=()=>st.get();
let OLD={chars:[],places:[],props:[]};CORE.oldStudio().then(o=>{OLD=o;render()}).catch(()=>{});
const STEPS=['① القصة','② التقسيم','③ اللقطات'];
const FORMS=[['short','فيلم قصير'],['episode','حلقة مسلسل'],['film','فيلم طويل (بأجزاء)'],['sketch','سكتش/ريل كوميدي']];
const ASPECTS=[['9:16','9:16 عمودي'],['16:9','16:9 أفقي'],['1:1','1:1 مربع']];
const VISL=CORE.VISUALS.map(v=>[v[0],v[1]]);
const G=()=>CORE.pick(CORE.GENRES,p().genre),L=()=>CORE.pick(CORE.LANGS,p().lang),S=()=>CORE.pick(CORE.SATIRE,p().satire),VO=()=>CORE.pick(CORE.VOICES,p().voice),V=()=>CORE.pick(CORE.VISUALS,p().visual);
const visName=()=>(p().customVisual||'').trim()||V()[1];
const visRules=()=>(p().customVisual||'').trim()?'التزم بالوصف المخصص حرفيًا':V()[3];
const voiceTxt=()=>p().voice==='custom'?('يتقلد بصمة العينة دي:\n"""'+(p().customVoice||'')+'"""'):VO()[1]+': '+VO()[2];
const castTxt=()=>{const x=(p().singer||'').trim();return CORE.castTxt(p())+(x?'شخصيات إضافية:\n'+x+'\n':'')};
const _oldCast=()=>{const a=chars().map(c=>'- '+c.name+': '+(c.ar||'')+((c.voiceAr||'').trim()?' | الصوت: '+c.voiceAr.trim():'')),x=(p().singer||'').trim();return (a.length||x)?'الشخصيات (شكلها وصوتها ثابتين في كل لقطة):\n'+a.join('\n')+(x?'\n'+x:'')+'\n':''};
const singerLine=()=>castTxt();
const MCTX=()=>{const P=p();return `${CORE.pick(FORMS,P.form)[1]}${P.series?' من مسلسل «'+P.series+'»':''}، ${G()[1]}، مدته ${P.sec} ثانية.\n${(P.script||P.idea||'').slice(0,1500)}`};
const memTxt=()=>{const P=p();if(P.form!=='episode')return '';return (P.series?'المسلسل: '+P.series+'\n':'')+(P.bible.trim()?'عالم المسلسل وقواعده:\n'+P.bible.trim()+'\n':'')+(P.eps.length?'ملخص الحلقات السابقة (التزم بالاستمرارية ولا تكرر نفس النكتة أو الحبكة):\n'+P.eps.map((e,i)=>'حلقة '+(i+1)+': '+e).join('\n')+'\n':'')};
const base=()=>{const P=p();return `${memTxt()}${castTxt()}${P.place.trim()?'المكان: '+P.place.trim()+'\n':''}الشكل: ${CORE.pick(FORMS,P.form)[1]}، مدته ${P.sec} ثانية، مقاس ${P.aspect}.\nالنوع: ${G()[1]} (${G()[2]}).\nالشكل البصري: ${visName()} (${visRules()}).\nلغة الحوار والراوي: ${L()[2]}.\n${S()[2]?'السخرية: '+S()[2]+'.\n':''}البصمة: ${voiceTxt()}\n${CORE.hookEmoTxt(P)}${CORE.WRITING}`};
const PR={
ideas(){return `أنت فريق: ${CORE.TEAM.film}. اقترح 5 أفكار أصلية غير متوقعة${p().idea.trim()?' حوالين: '+p().idea.trim():''}. لكل فكرة: عنوان، وجملة الهوك (أول 3 ثواني)، والصراع، والتحول، والنهاية المفاجئة، في 4 أسطر. وفي الآخر رشّح الأقوى في سطر.\n\n${base()}`},
write(){const P=p();if(!P.idea.trim()){alert('اكتب الفكرة الأول');return ''}
 return `أنت فريق: ${CORE.TEAM.film}. اكتب سيناريو كامل للفكرة دي:\n${P.idea.trim()}\n\nالشروط: هوك قوي في أول 3 ثواني (بصري + سمعي)، صراع واضح، تصاعد، ذروة، ونهاية مفاجئة أو مؤثرة. تفاعل طبيعي بين الشخصيات: المستمع بيتفاعل، ومفيش شخصية واخدة كل الكلام والحركة. الحوار قليل ومحدد ويتقال بصوت عالي. الكتابة الظاهرة على الشاشة بين [نص الشاشة: ...]. المؤثرات بين [صوت: ...].\nالناتج: مشاهد مرقمة، لكل مشهد: المكان والوقت، ثم الحدث، ثم الحوار. بدون شرح.\n\n${base()}`},
team(){const P=p();if(!P.script.trim()){alert('الصق السيناريو الأول');return ''}return CORE.teamReview('سيناريو '+CORE.pick(FORMS,P.form)[1],CORE.TEAM.film,P.script.trim()+'\n\n'+memTxt()+castTxt())},
epSum(){const P=p();if(!P.script.trim()){alert('الصق السيناريو الأول');return ''}return `لخّص الحلقة دي في 3 أسطر للاستمرارية: أهم الأحداث، وأي تغيير في الشخصيات أو العلاقات، وأي نكتة أو جملة متكررة ظهرت. بدون مقدمات.\n"""\n${P.script.trim()}\n"""`},
ctx(){const P=p();return `الشكل البصري: ${visName()} (${visRules()}).\n${castTxt()}${P.place.trim()?'المكان: '+P.place.trim()+'\n':''}المقاس: ${P.aspect}. المدة: ${P.sec} ثانية.\n`},
shots(k){const P=p(),n=CORE.partsN(P.sec,P.parts),[a,b]=CORE.partRange(P.sec,n,k);
 const fmt=`اكتب الناتج بالشكل ده بالظبط ومن غير أي كلام تاني:\nلقطة 1 | المدة بالثواني | الاسم: الجملة المنطوقة (أو بدون)\nالمشهد: وصف بصري محدد (مين فين، وضعه، قدامه إيه، بيبص فين، إحساسه)\nالكاميرا: واسعة أو متوسطة أو قريبة وحركتها\nالحركة: الحركة الوحيدة ومقدارها، ورد فعل المستمع\nالإضاءة: المصدر والاتجاه والألوان\nتغيير الشكل: أي تغيير مقصود في شكل أو ملامح أو لبس شخصية يبدأ في اللقطة دي (أو بدون)\n\nلقطة 2 | ...`;
 if(k===0){if(!P.script.trim()){alert('الصق السيناريو الأول (خطوة 1)');return ''}
  return `أنت فريق: ${CORE.TEAM.film}. حوّل السيناريو ده للقطات من غير ما تغيّر الأحداث أو الحوار.\n${PR.ctx()}${memTxt()}السيناريو:\n"""\n${P.script.trim()}\n"""\n\nقواعد: اللقطة 1 هي الهوك. كل لقطة 3 إلى 8 ثواني وفيها حركة واحدة. جملة حوار واحدة على الأكثر في اللقطة. ثبات الشكل والملابس والمكان والإضاءة بين اللقطات. ممنوع نصوص في الصورة. مجموع المدد = ${P.sec} ثانية.\n\n${fmt}`+(n>1?`\n\n⚠️ هنشتغل على ${n} أجزاء. اكتب الجزء 1 فقط: من 0 إلى ${b} ثانية، واكتب «تم الجزء 1 من ${n}» وانتظر «كمّل».`:'')}
 return `كمّل: اكتب الجزء ${k+1} من ${n} بنفس الصيغة والقواعد. من ${a} إلى ${b} ثانية. ابدأ من «لقطة ${P.shots.length+1}». ما تعيدش اللي فات. ${k===n-1?'ده آخر جزء: اختم القصة بوضوح. ':''}اكتب «تم الجزء ${k+1} من ${n}».`+(P.shots.length?'\n\nملخص اللي اتكتب (للسياق فقط):\n'+P.shots.map((s,i)=>(i+1)+') '+(s.desc||'').slice(0,80)).join('\n'):'')},
reels(){const P=p();if(!P.shots.length){alert('مفيش لقطات');return ''}return `أنت مونتير ومخطط محتوى. قسّم اللقطات دي لريلز مستقلة بالترتيب من غير إعادة ترتيب. العدد تحدده القصة. كل ريل لازم يكون: هوك، ثم مشكلة، ثم تصاعد، ثم قفلة كوميدية أو مشوّقة، ومدته بين 15 و60 ثانية. لكل ريل: أرقام اللقطات، والعنوان، والهوك المكتوب على الشاشة، والكابشن. اللقطة اللي مش هتشتغل لوحدها قول إزاي تتلحم.\n\n`+P.shots.map((s,i)=>`لقطة ${i+1} | ${s.dur}ث | ${s.lyric||'بدون'} | ${s.desc}`).join('\n')},
teamBoard(){const P=p();if(!P.shots.length){alert('مفيش لقطات');return ''}return CORE.teamReview('ستوري بورد',CORE.TEAM.film,PR.ctx()+P.shots.map((s,i)=>`لقطة ${i+1} | ${s.dur}ث | ${s.lyric||'بدون'}\nالمشهد: ${s.desc}\nالكاميرا: ${s.cam}\nالحركة: ${s.move}\nالإضاءة: ${s.light}`).join('\n\n'))},
shotP(i){const P=p(),s=P.shots[i],LK=lookAt(i),F=s.frame&&CORE.castFrames(P).find(f=>f.id===s.frame);return `${LK?'👗 تغيير مقصود في الشكل أو الملامح أو اللبس (لازم يظهر بوضوح): '+LK+'. كل الباقي في الشخصيات ثابت زي ما هو.\n':''}${F?'مرجع الكادر المرفق: «'+F.name+'» (التزم بأماكن الشخصيات والمكان فيه)\n':''}لقطة ${i+1} من ${P.shots.length} — المدة ${s.dur} ثانية — المقاس ${P.aspect}\nالشكل البصري: ${visName()} — ${visRules()}\n${castTxt()}${P.place.trim()?'المكان: '+P.place.trim()+'\n':''}المشهد: ${s.desc}\nالكاميرا: ${s.cam}\nالحركة: ${s.move}\nالإضاءة: ${s.light}\n${s.lyric?'الحوار: '+s.lyric+' (حركة الفم مطابقة للكلام، والمستمع بيتفاعل بشكل طبيعي)\n':'بدون كلام.\n'}${i>0?'استمر من نفس الشخصيات والملابس والمكان والإضاءة اللي في آخر كادر من اللقطة السابقة.\n':''}الصوت: كل شخصية بصوتها الثابت بدون تغيير.\nممنوع: نصوص، علامات مائية، تغيير شكل أو ملابس أي شخصية.`},
check(i){return `أنت مشرف جودة وراكور في فيلم عالمي. هرفق لك صورة/كادر اللقطة ${i+1}. قارنها بالوصف ده وبشكل الشخصيات الثابت، وافحص بعمق: الشخصيات والملامح والملابس، العدد، المكان، الوضع والنظرة، الأيدي والأصابع، الخلفية، الإضاءة، والأسلوب البصري. ارجع بحكم واحد قاطع: «مقبولة» أو «أعد التوليد»، وسبب في سطر، وتعليمة تعديل واحدة جاهزة للصق في المولّد. بدون خيارات.\n\nالوصف:\n"""\n${PR.shotP(i)}\n"""`},
shotEn(i){return `ترجم أمر توليد الفيديو ده للإنجليزي بصيغة أمر احترافي لـ Google Flow، مع الحفاظ على كل التفاصيل، واترك الحوار المنطوق بلغته الأصلية بين علامتي تنصيص. ارجع بالأمر فقط:\n"""\n${PR.shotP(i)}\n"""`}
};

/* ---------- تحليل اللقطات ---------- */
const HDR=/^[ \t]*[^\n؀-ۿA-Za-z0-9]{0,8}(?:ال)?(?:لقطة|لقطه|shot)\s*(?:رقم\s*)?[\d٠-٩]+/im;
const num=x=>+String(x).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^\d.]/g,'')||0;
function parseShots(t){const re=new RegExp(HDR.source,'gim'),idx=[];let m;while((m=re.exec(t)))idx.push(m.index);
 return idx.map((s0,k)=>{const blk=t.slice(s0,idx[k+1]||t.length),lines=blk.split('\n').map(l=>l.replace(/\*\*/g,'').trim());
  const head=lines[0].replace(HDR,'').replace(/^[\s:|\-–]+/,''),h=head.split('|').map(x=>x.trim());
  const g=(...ks)=>{for(const k of ks){const l=lines.find(x=>new RegExp('^[\\-•\\s]*'+k+'\\s*[:：]').test(x));if(l)return l.replace(/^[^:：]*[:：]\s*/,'').trim()}return ''};
  const none=v=>/^\s*(بدون|لا يوجد|لا شيء|لا|none|-|—)\s*[.)(]*\s*$/i.test(v||'')?'':(v||'');
  let dur=num(h[0]||'');if(!dur)dur=4;
  return {dur:Math.max(1,Math.min(15,dur)),lyric:none(h[1]||g('الكلمات','الأغنية')),desc:g('المشهد','ماذا يحدث','الوصف'),cam:g('الكاميرا'),move:g('الحركة'),light:g('الإضاءة','الاضاءة'),look:none(g('تغيير الشكل','تغيير اللبس','تغيير الملامح')),img:'',done:false}})}


/* ---------- صورة البداية + الاستمرار ---------- */
function camKind(c){c=c||'';return /قريب|close/i.test(c)?'close':/واسع|عام|wide/i.test(c)?'wide':/متوسط|medium/i.test(c)?'mid':/كتف/.test(c)?'ots':''}
function imgNeed(i){const sh=p().shots,s=sh[i];if(!s)return {n:true,why:''};if(s.imgMode==='new')return {n:true,why:'اخترت صورة جديدة'};if(s.imgMode==='last')return {n:false,why:'اخترت آخر كادر'};
 if(i===0)return {n:true,why:'أول لقطة'};const pr=sh[i-1];if((s.frame||'')!==(pr.frame||''))return {n:true,why:'مرجع كادر مختلف'};if((s.look||'').trim())return {n:true,why:'تغيير في الشكل'};
 const a=camKind(s.cam),b=camKind(pr.cam);if(a&&b&&a!==b)return {n:true,why:'زاوية الكاميرا اتغيرت'};return {n:false,why:'نفس الكادر بيكمل'}}
function imgBadge(i){const k=imgNeed(i);return k.n?`<div class="m" style="color:#7dd3fc;margin-top:6px">🖼️ محتاج صورة بداية جديدة (${k.why})</div>`:`<div class="m" style="color:#86efac;margin-top:6px">🔗 خد آخر كادر من فيديو اللقطة ${i} واستخدمه صورة البداية (${k.why})</div>`}
PR.imgP=function(i){const P=p(),s=P.shots[i],LK=lookAt(i),F=s.frame&&CORE.castFrames(P).find(f=>f.id===s.frame);
 return `Generate ONE still image: the exact first frame of shot ${i+1}. Aspect ratio ${P.aspect}.
الشكل البصري: ${visName()} — ${visRules()}
${singerLine()}${F?'مرجع الكادر المرفق «'+F.name+'»: نفس أماكن الشخصيات والمكان والزاوية بالظبط.\n':''}${LK?'تغيير مقصود في الشكل أو اللبس (لازم يظهر): '+LK+'\n':''}المشهد (اللحظة الأولى): ${s.desc}
الكاميرا: ${s.cam}
الإضاءة: ${s.light}
${CORE.lessonsTxt()}ممنوع: أي نصوص أو حروف أو علامات مائية، أو تغيير شكل الشخصيات عن الوصف الثابت، أو أيدي وأصابع مشوهة.`};
{const _sp=PR.shotP;PR.shotP=i=>{const k=imgNeed(i);return _sp(i)+'\n'+(k.n?'':'صورة البداية المرفقة هي آخر كادر من اللقطة السابقة: كمّل منها بالظبط بنفس الأماكن والإضاءة.\n')+CORE.lessonsTxt()}}
/* ---------- العرض ---------- */
function lookAt(i){const sh=p().shots;if(sh[i]&&(sh[i].look||'').trim())return sh[i].look.trim();for(let j=i-1;j>=0;j--){const x=sh[j];if((x.look||'').trim())return x.lookKeep?x.look.trim():''}return ''}
const thumb=s=>s.img||CORE.frameImg(s.frame)||'';
function insBtn(i){return `<div style="text-align:center;margin:-4px 0"><button class="b" data-a="ins" data-i="${i}" style="margin:0;padding:4px 12px;font-size:13px;opacity:.85">➕ لقطة هنا</button></div>`}
function gridHTML(){const P=p();return `<div class="m" style="margin:6px 0">اضغط على لقطة تفتحها • اسحب من ⠿ لتغيير الترتيب</div><div id="sgrid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">${P.shots.map((s,i)=>`<div class="gt" data-gi="${i}" style="position:relative;background:#0f172a;border:1px solid ${s.done?'#166534':'var(--border)'};border-radius:10px;overflow:hidden;aspect-ratio:${P.aspect==='16:9'?'16/9':P.aspect==='1:1'?'1/1':'9/16'};cursor:pointer">${thumb(s)?`<img src="${thumb(s)}" style="width:100%;height:100%;object-fit:cover;display:block">`:`<div style="padding:6px;font-size:11px;color:#cbd5e1;line-height:1.5">${esc((s.desc||'').slice(0,70))}</div>`}<span style="position:absolute;top:3px;right:3px;background:#000a;border-radius:6px;padding:0 5px;font-size:12px">${i+1}${(s.look||'').trim()?' 👗':''}</span><span style="position:absolute;bottom:3px;right:3px;background:#000a;border-radius:6px;padding:0 5px;font-size:11px">${s.dur}ث${s.done?' ✓':''}</span><span class="gh" data-gh="${i}" style="position:absolute;top:2px;left:2px;background:#000c;border-radius:6px;padding:2px 7px;font-size:16px;touch-action:none">⠿</span></div>`).join('')}</div>`}
function sel(f,list,v){return `<select data-f="${f}">${CORE.opts(list,v)}</select>`}
