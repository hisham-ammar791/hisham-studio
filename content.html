function orthEaster(y){const a=y%4,b=y%7,c=y%19,d=(19*c+15)%30,e=(2*a+4*b-d+34)%7,m=Math.floor((d+e+114)/31),dd=((d+e+114)%31)+1;return addD(new Date(y,m-1,dd),13)}
function nthWd(y,m,wd,n){if(n>0){const d=new Date(y,m-1,1);return new Date(y,m-1,1+((wd-d.getDay()+7)%7)+(n-1)*7)}const d=new Date(y,m,0);return new Date(y,m-1,d.getDate()-((d.getDay()-wd+7)%7))}
const inRange=(d,r)=>{const md=(d.getMonth()+1)*100+d.getDate(),a=r[0]*100+r[1],b=r[2]*100+r[3];return a<=b?md>=a&&md<=b:md>=a||md<=b};
function occasions(){const s=startDate(),n=+p().pDays||30,out=[],seen={};
 const add=(d,key,name,tip,kind)=>{const k=key+'-'+d.getFullYear();if(seen[k])return;seen[k]=1;out.push({key:k,d,name,tip,kind})};
 for(let i=0;i<n;i++){const d=addD(s,i),y=d.getFullYear(),m=d.getMonth()+1,dd=d.getDate(),same=x=>x.getMonth()===d.getMonth()&&x.getDate()===dd;
  GFIX.forEach(g=>{if(g[0]===m&&g[1]===dd)add(d,g[2],g[3],g[4],/عالمي|أسبوع|شهر|الصحة/.test(g[3])?'🩺':'🇪🇬')});
  if(same(nthWd(y,3,4,2)))add(d,'kidney','اليوم العالمي للكلى','','🩺');
  if(same(nthWd(y,11,5,-1)))add(d,'whitefri','الجمعة البيضاء (عروض)','عروض حقيقية بأسعار واضحة','🛍️');
  const ea=orthEaster(y);if(same(ea))add(d,'easter','عيد القيامة المجيد','','🇪🇬');if(same(addD(ea,1)))add(d,'sham','شم النسيم','الفسيخ والرنجة والتسمم الغذائي','🇪🇬');
  if(HFMT){const h=hij(d);HIJ.forEach(x=>{if(x[0]===h.m&&x[1]===h.d)add(d,x[2],x[3]+' ≈',x[4],'🌙')})}
  GRANGE.forEach(r=>{if(inRange(d,r))add(d,r[4],r[5],r[6],r[4]==='waaw'?'🩺':'📆')})}
 return out}

const OUT={ideas:o=>{p().iPaste=o;st.save();parseIdeas()},comp:o=>{p().compOut=o},four:o=>{p().fourOut=o},car:o=>{p().cPaste=o;st.save();parseSlides()},reel:o=>{p().rOut=o},plan:o=>{p().planPaste=o;st.save();parsePlan()},day:(o,i)=>{const r=p().plan[i];if(r)r.out=o},health:o=>{p().hOut=o},reply:o=>{p().rpOut=o;st.save();parseReplies()},perf:o=>{p().perfOut=o}};
async function runAg(k,arg){if(!CORE.gemKey()){CORE.agentKeyBox();return}if(busy){toast('استنى، الفريق لسه شغال…');return}const t=PR[k](arg);if(!t)return;busy=true;st.snap('قبل '+k,true);
 try{const o=await CORE.gemRun([t],s=>toast(s,90000));OUT[k](String(o||'').trim(),arg);st.save();toast('✓ الرد وصل');render()}catch(x){toast('⚠️ '+x.message,5000)}busy=false}
const csv=(name,head,rows)=>{const q=x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"',t='\ufeff'+[head].concat(rows).map(r=>r.map(q).join(',')).join('\n'),f=new File([t],name,{type:'text/csv'});
 (async()=>{try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e&&e.name==='AbortError')return}const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=name;a.click()})()};
const go=k=>{p().step=k;st.save();render();window.scrollTo(0,0)};

document.addEventListener('input',e=>{const t=e.target,P=p();if(!t.dataset)return;
 if(t.dataset.f&&t.tagName!=='SELECT'&&t.type!=='date'){P[t.dataset.f]=t.type==='number'?(+t.value||0):t.value;st.save();return}
 if(t.dataset.sl){const [i,f]=t.dataset.sl.split(':'),s=P.slides[+i];if(s){s[f]=t.value;st.save()}return}
 if(t.dataset.pl){const [i,f]=t.dataset.pl.split(':'),r=P.plan[+i];if(r){r[f]=t.value;st.save()}return}
 if(t.dataset.rp!==undefined){const l=REP.get(),r=l[+t.dataset.rp];if(r){r.text=t.value;REP.set(l)}return}
 if(t.dataset.v){const v=VARS.get();v[t.dataset.v]=t.value;VARS.set(v);return}
 if(t.dataset.pf&&t.tagName!=='SELECT'){pf[t.dataset.pf]=t.value;return}
 if(t.dataset.lq!==undefined){libQ=t.value;const b=document.getElementById('libList');if(b)b.innerHTML=libItems()}});
document.addEventListener('change',e=>{const t=e.target,P=p();if(!t.dataset)return;
 if(t.dataset.f&&(t.tagName==='SELECT'||t.type==='date')){const f=t.dataset.f;P[f]=/^(iCount|fSec|cN|rSec|pDays|pPerWeek)$/.test(f)?+t.value:t.value;if(f==='niche'&&HEALTHY.includes(t.value))P.health=true;st.save();if(/^(niche|voice|pStart|pDays)$/.test(f))render();return}
 if(t.dataset.pf&&t.tagName==='SELECT'){pf[t.dataset.pf]=t.value;return}
 if(t.dataset.chk){P[t.dataset.chk]=t.checked;st.save();return}
 if(t.dataset.occ){const k=t.dataset.occ,i=P.occOff.indexOf(k);if(t.checked&&i>=0)P.occOff.splice(i,1);if(!t.checked&&i<0)P.occOff.push(k);st.save();return}
